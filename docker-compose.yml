version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      args:
        - UID=1001
        - GID=1001
    user: "1001:1001"
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://shortener:shortener@db:5432/shortener
    networks:
      - appnet
    # ----------------------------------------------------------------------
    # CRITICAL FIX: Ensures Alembic migrations run BEFORE the Uvicorn server starts.
    # ----------------------------------------------------------------------
    command: ["/bin/sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      # Using Python in the image for a lightweight check. Quote carefully.
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://localhost:8000/\")'"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  appnet:
    driver: bridge

volumes:
  postgres_data: {}
